name: Idea or feature request
description: Suggest something for KinTerm, like a new face set or support for another agent.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or problem, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you'd like KinTerm to handle it. Sketches welcome.
