<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New agent tab menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7aa7ff}a:hover{color:#a9c6ff}
.item{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:#e4e6ea;font:400 13px Inter,system-ui,sans-serif;text-align:left;cursor:pointer;box-sizing:border-box}
.item:hover{background:#3b6fd8;color:#fff}
.item:disabled{color:#6f747e;cursor:default}
.item:disabled:hover{background:transparent;color:#6f747e}
.kbd{margin-left:auto;color:#8a8f99;font-size:12px}
.item:hover .kbd{color:#dfe7ff}
</style>
</helmet>
<div style="width: 640px; height: 560px; box-sizing: border-box; padding: 36px; background: #16171b; color: #d6d9df; font-family: Inter, system-ui, sans-serif; position: relative">
  <div style="display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 10px; border-radius: 12px 12px 0 0; background: #22242a; border: 1px solid #2e3038">
    <div style="flex: 1; display: flex; gap: 4px; min-width: 0">
      <div style="flex: 1; max-width: 180px; height: 34px; border-radius: 8px; background: #33363f; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12.5px; color: #f1f2f4">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: #3fb950"></span>docs · changelog
      </div>
      <div style="flex: 1; max-width: 180px; height: 34px; border-radius: 8px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12.5px; color: #a8adb7">
        <span style="width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; border: 2px solid #7d828c"></span>infra · terraform
      </div>
    </div>
    <button aria-label="New tab" style="width: 30px; height: 30px; border: 0; border-radius: 8px; background: #3b6fd8; color: #fff; font-size: 18px">+</button>
  </div>
  <div style="position: absolute; top: 88px; right: 36px; width: 330px; padding: 6px; border-radius: 12px; background: #26282f; border: 1px solid #3a3d47; box-shadow: 0 20px 50px rgba(0,0,0,.55)">
    <button class="item">New Tab<span class="kbd">⌘T</span></button>
    <button class="item">New Split<span class="kbd">⌘D</span></button>
    <div style="height: 1px; margin: 6px 8px; background: #3a3d47"></div>
    <div style="padding: 6px 12px 4px; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; color: #8a8f99">CLAUDE CODE</div>
    <sc-for list="{{accounts}}" as="a" hint-placeholder-count="2">
      <button class="item">
        <span style="width: 10px; height: 10px; border-radius: 3px; background: {{a.color}}" aria-hidden="true"></span>
        <span style="display: flex; flex-direction: column; line-height: 1.3; padding: 6px 0">
          <span>{{a.name}}</span>
          <span style="font-size: 11.5px; color: #8a8f99">{{a.dir}} · {{a.running}}</span>
        </span>
        <span class="kbd">{{a.kbd}}</span>
      </button>
    </sc-for>
    <button class="item" style="color: #a8adb7">Add account…</button>
    <div style="height: 1px; margin: 6px 8px; background: #3a3d47"></div>
    <label style="display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 12px; font-size: 13px; color: #e4e6ea">
      <input type="checkbox" style="accent-color: #3b6fd8; margin: 0">
      Start in a new git worktree
    </label>
    <div style="height: 1px; margin: 6px 8px; background: #3a3d47"></div>
    <button class="item" disabled="">Codex<span class="kbd">later</span></button>
    <button class="item" disabled="">Gemini CLI<span class="kbd">later</span></button>
  </div>
  <div style="position: absolute; left: 36px; bottom: 36px; width: 230px; font-size: 12.5px; line-height: 1.55; color: #8a8f99">Each account runs <code style="color: #c2c6cf">claude</code> with its own <code style="color: #c2c6cf">CLAUDE_CONFIG_DIR</code>. Its color shows as a stripe on every tab it owns.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accounts: [
        { name: 'Work', dir: '~/.claude-work', running: '2 running', color: '#8b7cf6', kbd: '⌥⌘1' },
        { name: 'Personal', dir: '~/.claude-account1', running: '2 running', color: '#2dd4bf', kbd: '⌥⌘2' }
      ]
    };
  }
}
</script>
</body>
</html>
