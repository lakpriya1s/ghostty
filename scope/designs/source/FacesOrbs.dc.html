<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Face set A · Orbs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7aa7ff}a:hover{color:#a9c6ff}
.big{display:block;transform:scale(1.7)}
.ic{position:relative;display:block;width:40px;height:40px}
.ic>span{position:absolute;display:block}
.s-done::after{content:"";position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:#f1f2f4;border:2px solid #1c1d21}
.ic .a{inset:10px;border-radius:50%;background:var(--c)}
.ic .b,.ic .c{display:none}
.s-idle{--c:#8b9099}
.s-idle .a{opacity:.75;animation:breathe 3.2s ease-in-out infinite}
.s-working{--c:#5ca0ff}
.s-working .a{inset:12px;box-shadow:0 0 12px rgba(92,160,255,.7)}
.s-working .b{display:block;inset:2px;border-radius:50%;border:3px solid transparent;border-top-color:#5ca0ff;border-right-color:rgba(92,160,255,.35);animation:spin .9s linear infinite}
.s-working .c{display:block;inset:-3px;border-radius:50%;border:2px solid transparent;border-bottom-color:rgba(159,208,255,.7);animation:spin 1.6s linear infinite reverse}
.s-waiting{--c:#f5a524}
.s-waiting .a{box-shadow:0 0 10px rgba(245,165,36,.6)}
.s-waiting .b,.s-waiting .c{display:block;inset:10px;border-radius:50%;border:2px solid #f5a524;box-sizing:border-box;animation:ripple 1.6s ease-out infinite}
.s-waiting .c{animation-delay:.8s}
.s-done{--c:#3fb950}
.s-done .a{inset:7px}
.s-done .c{display:block;left:16px;top:12px;width:6px;height:12px;border:solid #15161b;border-width:0 3px 3px 0;transform:rotate(45deg)}
.s-error{--c:#f85149;animation:shake 2.4s ease-in-out infinite}
.s-error .a{inset:7px}
.s-error .b{display:block;left:18.5px;top:13px;width:3px;height:9px;border-radius:2px;background:#15161b}
.s-error .c{display:block;left:18.5px;top:24px;width:3px;height:3px;border-radius:2px;background:#15161b}
.s-shell .a{inset:6px;border-radius:9px;background:#2a2c33;box-shadow:inset 0 0 0 1.5px #4a4e59}
.s-shell .c{display:block;left:14px;top:13px;width:7px;height:13px;border-radius:1px;background:#c2c6cf;animation:blink 1.1s step-end infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(.85)}50%{transform:scale(1)}}
@keyframes ripple{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.1);opacity:0}}
@keyframes shake{0%,88%,100%{transform:translateX(0)}91%{transform:translateX(-2px)}94%{transform:translateX(2px)}97%{transform:translateX(-1px)}}
@keyframes blink{50%{opacity:0}}
</style>
</helmet>
<div style="width: 900px; height: 520px; box-sizing: border-box; padding: 40px 48px; background: #16171b; color: #d6d9df; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px">
  <div>
    <h1 style="margin: 0 0 6px; font-size: 24px; font-weight: 600; color: #f1f2f4">Set A · Orbs</h1>
    <p style="margin: 0; font-size: 14px; color: #a8adb7">No face, just a glowing dot. Calm and minimal; motion does the talking: breathe, orbit, ripple, still, shake.</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 28px 10px 16px; border-radius: 14px; background: #1c1d21; border: 1px solid #2e3038">
        <span style="display: flex; align-items: center; justify-content: center; width: 80px; height: 80px" aria-hidden="true">
          <span class="big"><span class="ic {{r.cls}}"><span class="a"></span><span class="b"></span><span class="c"></span></span></span>
        </span>
        <div style="font-size: 14px; font-weight: 600; color: #f1f2f4; text-align: center">{{r.name}}</div>
        <div style="font-size: 12px; color: #a8adb7; text-align: center; line-height: 1.45">{{r.desc}}</div>
      </div>
    </sc-for>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 11.5px; font-weight: 600; letter-spacing: .04em; color: #8a8f99">IN THE TAB BAR · ACTUAL SIZE</span>
    <div style="display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 10px; background: #22242a; border: 1px solid #2e3038">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <span style="display: flex; align-items: center; justify-content: center; width: 58px; height: 58px; border-radius: 14px; background: {{r.tabBg}}" aria-hidden="true">
          <span class="ic {{r.cls}}"><span class="a"></span><span class="b"></span><span class="c"></span></span>
        </span>
      </sc-for>
      <span style="margin-left: auto; font-size: 12px; color: #8a8f99">Quietest of the sets</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { cls: 's-idle', name: 'Idle', desc: 'Dim, slow breathing.' },
      { cls: 's-working', name: 'Working', desc: 'Glowing, rings orbit.' },
      { cls: 's-waiting', name: 'Waiting on you', desc: 'Ripples outward.' },
      { cls: 's-done', name: 'Done', desc: 'Solid with a check, unread dot.' },
      { cls: 's-error', name: 'Error', desc: 'Exclamation, small shake.' },
      { cls: 's-shell', name: 'Plain shell', desc: 'Blinking cursor block.' }
    ];
    return { rows: rows.map((r, i) => ({ ...r, tabBg: i === 0 ? '#363944' : r.cls === 's-shell' ? '#22242a' : '#2a2c35' })) };
  }
}
</script>
</body>
</html>
